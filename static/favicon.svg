<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ffb3"/>
      <stop offset="0.55" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#b26bff"/>
    </linearGradient>
    <radialGradient id="bg" cx="50%" cy="40%" r="72%">
      <stop offset="0" stop-color="#11111a"/>
      <stop offset="1" stop-color="#050507"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.55">
    <animate attributeName="r" values="16;24;16" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0.1;0.8" dur="2s" repeatCount="indefinite"/>
  </circle>
  <path d="M32 12 L50 32 L32 52 L14 32 Z" fill="none" stroke="url(#g)" stroke-width="3" filter="url(#glow)">
    <animate attributeName="opacity" values="1;0.65;1" dur="1.6s" repeatCount="indefinite"/>
  </path>
  <circle cx="32" cy="32" r="4" fill="#00ffb3" filter="url(#glow)">
    <animate attributeName="r" values="3;5;3" dur="1.2s" repeatCount="indefinite"/>
  </circle>
</svg>
